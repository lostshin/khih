name: Khih
options:
  bundleIdPrefix: tw.lokun
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  defaultLocalization: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Sources/Info.plist reads both from here — hardcoding them there instead
    # silently pins every build to one version, and the version is what
    # settings and What's New show. Bump CURRENT_PROJECT_VERSION on release.
    MARKETING_VERSION: "1.7.0"
    CURRENT_PROJECT_VERSION: "9"
    # Ad-hoc. The Developer ID identity this used to name belongs to the
    # upstream project, and signing with someone else's team is not something a
    # fork gets to do — nor could it, without their certificate.
    #
    # What that identity bought upstream was keychain stability: the ACL behind
    # Claude Code's "Always Allow" remembers which signed binary was granted
    # access. Measured here, an ad-hoc rebuild keeps the grant, and the read
    # has a CLI fallback when it does not. Distribution needs a real Developer
    # ID; see TEAM_ID in the Makefile.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    # Required by notarization. Worth knowing what it does *not* break here:
    # the keychain read is unaffected (the ACL keys on the signing identity,
    # which is unchanged), and reading Cursor's and Codex's SQLite files is
    # ordinary file access. It is the App Sandbox that would break both, which
    # is why that stays off — Developer ID distribution does not require it.
    ENABLE_HARDENED_RUNTIME: "YES"
    ENABLE_APP_SANDBOX: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

packages:
  SwiftNIO:
    url: https://github.com/apple/swift-nio
    from: "2.102.0"

targets:
  Khih:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: SwiftNIO
        product: NIOHTTP1
      - package: SwiftNIO
        product: NIOPosix
    info:
      path: Sources/Info.plist
      properties:
        # Deliberately a normal Dock app, not an `LSUIElement` agent. The
        # notch is ambient, but the *app* still has to be findable: without a
        # Dock tile there is nothing to click to open it, nothing in Cmd-Tab,
        # and no obvious way to reach settings or quit.
        CFBundleName: Khih
        CFBundleDisplayName: Khih
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - zh-Hant-TW
        LSMinimumSystemVersion: "15.0"
        # Sources/Info.plist is *generated* from this block, so editing that
        # file directly is undone by the next `make gen`. Pointing both at the
        # build settings keeps one place to bump.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tw.lokun.khih
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: "YES"
        DEVELOPMENT_LANGUAGE: en

  KhihTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Khih
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tw.lokun.khih.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Khih:
    build:
      targets:
        Khih: all
        KhihTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KhihTests
