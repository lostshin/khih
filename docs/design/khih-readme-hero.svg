  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans CJK TC', sans-serif">
    <text x="64" y="76" fill="#a6b9ad" font-size="18" letter-spacing="3">KHIH / macOS</text>
    <text x="60" y="226" fill="#f1f4eb" font-size="118" font-weight="600">缺</text>
    <text x="216" y="221" fill="#f1f4eb" font-size="100" font-weight="500" letter-spacing="-4">Khih</text>
    <text x="66" y="291" fill="#c5d1c8" font-size="26">把額度，收在螢幕邊緣。</text>
    <text x="66" y="407" fill="#a6b9ad" font-size="19">多帳號明細  /  五小時守護  /  台灣繁體中文</text>
